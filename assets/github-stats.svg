<svg
xmlns="http://www.w3.org/2000/svg"
width="760"
height="540"
viewBox="0 0 760 540">

<style>

.title {
    fill: #f0f6fc;
    font:
        600 20px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.subtitle {
    fill: #8b949e;
    font:
        13px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.number {
    fill: #f0f6fc;
    font:
        600 22px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.stat {
    fill: #8b949e;
    font:
        11px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    letter-spacing: .5px;
}

.label {
    fill: #c9d1d9;
    font:
        13px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.value {
    fill: #8b949e;
    font:
        13px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

</style>

<rect
